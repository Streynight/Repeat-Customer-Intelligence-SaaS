name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      DATABASE_URL: postgresql://localhost:5432/repeattree
      DIRECT_URL: postgresql://localhost:5432/repeattree
      CRON_SECRET: ci-cron-secret
      INTEGRATION_WEBHOOK_SECRET: ci-integration-webhook-secret
      HEALTHCHECK_SECRET: ci-healthcheck-secret
      UPSTASH_REDIS_REST_URL: https://redis.example.com
      UPSTASH_REDIS_REST_TOKEN: ci-redis-token
      INNGEST_EVENT_KEY: ci-inngest-event-key
      INNGEST_SIGNING_KEY: ci-inngest-signing-key
      STRIPE_SECRET_KEY: ci-stripe-secret
      STRIPE_WEBHOOK_SECRET: ci-stripe-webhook-secret
      STRIPE_PRICE_STARTER: price_starter_ci
      STRIPE_PRICE_GROWTH: price_growth_ci
      STRIPE_PRICE_SCALE: price_scale_ci
      RESEND_API_KEY: ci-resend-key
      RESEND_FROM_EMAIL: support@example.com
      POSTHOG_KEY: phc_ci
      POSTHOG_HOST: https://us.i.posthog.com
      SENTRY_DSN: https://public@example.com/1
      NEXT_PUBLIC_SENTRY_DSN: https://public@example.com/1
      SENTRY_TRACES_SAMPLE_RATE: "0.1"
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: "0.05"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run health:env
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
